<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codeur — agent IA de codage</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --user: #0ea5e9;
    --assistant: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 860px; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo { font-size: 26px; }
  header h1 { font-size: 18px; }
  header .model { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  button {
    background: var(--accent); color: #082f49; border: none;
    padding: 8px 14px; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-size: 13px;
  }
  button:hover { filter: brightness(1.1); }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--user); color: white; border-bottom-right-radius: 4px; }
  .msg.agent { position: relative; align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; padding-right: 36px; }
  .msg.error { align-self: flex-start; background: #7f1d1d; border: 1px solid #991b1b; }
  .copy-btn {
    position: absolute; top: 6px; right: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px;
    padding: 1px 6px; font-size: 12px; cursor: pointer;
    line-height: 1.4; opacity: 0; transition: opacity .15s;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .msg.agent:hover .copy-btn, details.tools:hover .copy-btn { opacity: 1; }
  details.tools {
    align-self: flex-start; max-width: 95%;
    font-size: 12px; color: var(--muted);
    background: #0b1220; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
    position: relative;
  }
  details.tools[open] { padding-right: 30px; }
  details.tools summary { cursor: pointer; user-select: none; }
  details.tools pre {
    margin-top: 6px; font-size: 11px; white-space: pre-wrap;
    max-height: 220px; overflow-y: auto; color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
  }
  .turn.agent {
    align-self: flex-start; display: flex; flex-direction: column;
    gap: 6px; max-width: 95%;
  }
  .turn.agent .msg.agent { align-self: flex-start; }
  .tool-live {
    align-self: flex-start; font-size: 11px; color: var(--muted);
    background: #0b1220; border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; font-family: ui-monospace, Consolas, monospace;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .typing { display: flex; gap: 5px; padding: 6px 2px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg); color: var(--text);
    padding: 12px; font-family: inherit; font-size: 14px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  #hint { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0 2px; }
  #attachments {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px 0;
  }
  #attachments:empty { padding: 0; }
  .attach-chip {
    display: flex; align-items: center; gap: 6px;
    background: #0b1220; border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 8px; font-size: 12px;
    max-width: 240px;
  }
  .attach-chip img {
    width: 26px; height: 26px; object-fit: cover; border-radius: 4px;
  }
  .attach-chip .attach-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .attach-chip .attach-remove { cursor: pointer; color: var(--muted); font-weight: 700; padding: 0 2px; }
  .attach-chip .attach-remove:hover { color: #f87171; }
  #fileInput { display: none; }
  #attachBtn {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); padding: 9px 10px;
  }
  #attachBtn:hover { color: var(--text); border-color: var(--accent); }
  footer { align-items: flex-end; }
  .msg.user img.thumb {
    display: block; max-width: 260px; max-height: 260px;
    border-radius: 8px; margin-top: 6px; border: 1px solid rgba(255,255,255,.35);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">🤖</span>
    <div>
      <h1>Codeur</h1>
      <div class="model">agent de codage local — __MODEL__</div>
    </div>
    <div class="spacer"></div>
    <button id="reset">Nouvelle session</button>
  </header>

  <div id="messages"></div>

  <div id="hint">L'agent peut lire, créer, modifier du code, chercher des mots dans un dossier, résumer des documents et exécuter des commandes. Joignez un fichier ou une image avec 📎, ou collez une capture d'écran (Ctrl+V).</div>
  <div id="attachments"></div>
  <footer>
    <button id="attachBtn" title="Joindre un fichier ou une image">📎</button>
    <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.odt,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.c,.cpp,.h,.java,.rs,.go,.tex,image/*">
    <textarea id="input" rows="2" placeholder="Posez votre question au Codeur… (Entrée = envoyer, Maj+Entrée = nouvelle ligne)"></textarea>
    <button id="send">Envoyer</button>
  </footer></div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const resetBtn = document.getElementById("reset");
  const attachBtn = document.getElementById("attachBtn");
  const fileInput = document.getElementById("fileInput");
  const attachmentsEl = document.getElementById("attachments");

  let pendingFiles = [];   // pièces jointes prêtes à envoyer : {name, b64, isImage, dataUrl, size}
  const MAX_FILES = 8, MAX_FILE_SIZE = 8 * 1024 * 1024, IMAGE_TYPES = /^image\//;

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function addFiles(fileList) {
    for (const file of fileList) {
      if (pendingFiles.length >= MAX_FILES) {
        alert("Maximum " + MAX_FILES + " fichiers par message.");
        break;
      }
      if (file.size > MAX_FILE_SIZE) {
        alert("Fichier trop volumineux : " + file.name + " (max 8 Mo).");
        continue;
      }
      const isImage = IMAGE_TYPES.test(file.type);
      const dataUrl = await readAsDataURL(file);
      pendingFiles.push({
        name: file.name,
        b64: dataUrl.split(",")[1],
        isImage,
        dataUrl,
        size: file.size,
      });
    }
    renderAttachments();
  }

  function renderAttachments() {
    attachmentsEl.innerHTML = "";
    pendingFiles.forEach((f, i) => {
      const chip = document.createElement("div");
      chip.className = "attach-chip";
      const icon = document.createElement("span");
      if (f.isImage) {
        const img = document.createElement("img");
        img.src = f.dataUrl;
        img.alt = f.name;
        chip.appendChild(img);
      } else {
        icon.textContent = "📄";
        chip.appendChild(icon);
      }
      const name = document.createElement("span");
      name.className = "attach-name";
      name.textContent = f.name;
      name.title = f.name + " (" + (f.size / 1024).toFixed(1) + " Ko)";
      chip.appendChild(name);
      const x = document.createElement("span");
      x.className = "attach-remove";
      x.textContent = "×";
      x.title = "Retirer";
      x.onclick = () => { pendingFiles.splice(i, 1); renderAttachments(); };
      chip.appendChild(x);
      attachmentsEl.appendChild(chip);
    });
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    await addFiles(Array.from(fileInput.files || []));
    fileInput.value = "";
  });
  document.body.addEventListener("dragover", (e) => e.preventDefault());
  document.body.addEventListener("drop", (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      addFiles(Array.from(e.dataTransfer.files));
    }
  });
  document.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const images = Array.from(items).filter(it => it.type && IMAGE_TYPES.test(it.type));
    if (!images.length) return;   // pas d'image : laisser le collage de texte normal
    e.preventDefault();
    const ts = new Date().toISOString().replace(/[:.]/g, "-");
    const files = images.map((it, i) => {
      const f = it.getAsFile();
      if (!f) return null;
      let ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
      const suffix = images.length > 1 ? "-" + (i + 1) : "";
      return new File([f], "capture-" + ts + suffix + "." + ext, { type: f.type });
    }).filter(Boolean);
    if (files.length) addFiles(files);
  });

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg agent";
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addToolsEl(container, tools) {
    if (!tools || tools.length === 0) return;
    const details = document.createElement("details");
    details.className = "tools";
    const summary = document.createElement("summary");
    summary.textContent = "🔧 " + tools.map(t => t.name).join(", ");
    details.appendChild(summary);
    for (const t of tools) {
      const pre = document.createElement("pre");
      const args = Object.entries(t.arguments || {})
        .map(([k, v]) => k + "=" + JSON.stringify(v)).join(", ");
      pre.textContent = "[outil] " + t.name + "(" + args + ")\n" + (t.result || "");
      details.appendChild(pre);
    }
    addCopyButton(details, () =>
      Array.from(details.querySelectorAll("pre"))
        .map(p => p.textContent).join("\n\n"));
    container.appendChild(details);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addCopyButton(target, getText) {
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "📋";
    btn.title = "Copier";
    btn.onclick = async (e) => {
      e.stopPropagation();
      const texte = getText();
      try {
        await navigator.clipboard.writeText(texte);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = texte;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      btn.textContent = "✓";
      setTimeout(() => { btn.textContent = "📋"; }, 1200);
    };
    target.appendChild(btn);
    return btn;
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    inputEl.disabled = busy;
    inputEl.placeholder = busy
      ? "Le Codeur réfléchit…"
      : "Posez votre question au Codeur… (Entrée = envoyer, Maj+Entrée = nouvelle ligne)";
  }

  async function ask() {
    const message = inputEl.value.trim();
    const files = pendingFiles.slice();
    if (!message && files.length === 0) return;
    inputEl.value = "";
    pendingFiles = [];
    renderAttachments();
    setBusy(true);
    const userBubble = addMessage("user", message || "📎 Fichiers joints");
    for (const f of files) {
      if (f.isImage) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = f.dataUrl;
        img.alt = f.name;
        img.title = f.name;
        userBubble.appendChild(img);
      }
    }
    const typing = addTyping();

    let turn = null;    // conteneur .turn.agent de cette réponse
    let bubble = null;  // bulle de texte en cours de remplissage
    let errored = false;

    const ensureTurn = () => {
      if (turn) return;
      typing.remove();
      turn = document.createElement("div");
      turn.className = "turn agent";
      messagesEl.appendChild(turn);
    };
    const ensureBubble = () => {
      ensureTurn();
      if (bubble) return;
      bubble = document.createElement("div");
      bubble.className = "msg agent";
      turn.appendChild(bubble);
    };

    const onEvent = (ev) => {
      if (ev.type === "text") {
        ensureBubble();
        bubble.textContent += ev.content;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (ev.type === "tool") {
        ensureTurn();
        const marker = document.createElement("div");
        marker.className = "tool-live";
        marker.textContent = "🔧 " + ev.name + "(" +
          Object.entries(ev.arguments || {})
            .map(([k, v]) => k + "=" + JSON.stringify(v)).join(", ") + ")";
        turn.appendChild(marker);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (ev.type === "done") {
        ensureTurn();
        addToolsEl(turn, ev.tools);
        if (bubble) addCopyButton(bubble, () => bubble.textContent);
      } else if (ev.type === "error") {
        errored = true;
        typing.remove();
        addMessage("error", ev.error || "Erreur serveur.");
      }
    };

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({
          message,
          files: files.map(f => ({ name: f.name, data: f.b64 })),
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        typing.remove();
        addMessage("error", data.error || "Erreur serveur (" + res.status + ").");
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = buffer.indexOf("\n\n")) >= 0) {
          const eventText = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);
          for (const line of eventText.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            try { onEvent(JSON.parse(payload)); } catch { /* ignoré */ }
          }
        }
      }
      for (const line of buffer.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try { onEvent(JSON.parse(payload)); } catch { /* ignoré */ }
      }
      if (!turn && !errored) {
        typing.remove();
        addMessage("error", "Aucune réponse reçue.");
      }
    } catch (err) {
      typing.remove();
      addMessage("error", "Impossible de joindre le serveur : " + err);
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", ask);
  resetBtn.addEventListener("click", async () => {
    await fetch("/api/reset", { method: "POST" });
    messagesEl.innerHTML = "";
    addMessage("agent", "Nouvelle session. Je vous écoute.");
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
  });

  addMessage("agent", "Bonjour ! Je suis le Codeur, votre agent de codage local. " +
    "Demandez-moi de créer ou modifier du code, d'expliquer des fichiers, de " +
    "chercher des mots dans un dossier, de résumer un document (Word, PDF, " +
    "Excel, PowerPoint) ou d'exécuter des commandes. Vous pouvez aussi joindre " +
    "des fichiers ou des images (bouton 📎, glisser-déposer ou Ctrl+V).");
  const welcome = document.querySelector(".msg.agent");
  addCopyButton(welcome, () => welcome.textContent);
  inputEl.focus();
</script>
</body>
</html>
